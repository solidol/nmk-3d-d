<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Розмірна схема монтажної панелі</title>
  <desc id="desc">Симетрична панель загальною шириною 90 міліметрів і висотою 50 міліметрів, з верхнім виступом шириною 50 міліметрів, двома отворами діаметром 6 міліметрів та центральним отвором діаметром 14 міліметрів.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="650" rx="18" fill="#f8fafc"/>
  <text x="500" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#18324d">Монтажна панель</text>
  <path fill="#dbeafe" stroke="#1d4ed8" stroke-width="4" d="M260 450 Q230 450 230 420 L230 300 Q230 270 260 270 H332 Q350 270 350 252 V180 Q350 150 380 150 H620 Q650 150 650 180 V252 Q650 270 668 270 H740 Q770 270 770 300 V420 Q770 450 740 450 Z"/>
  <path fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8" d="M190 360 H810 M500 120 V490"/>
  <circle fill="#fff" stroke="#c2410c" stroke-width="4" cx="320" cy="360" r="18"/>
  <circle fill="#fff" stroke="#c2410c" stroke-width="4" cx="680" cy="360" r="18"/>
  <circle fill="#fff" stroke="#c2410c" stroke-width="4" cx="500" cy="210" r="42"/>
  <circle cx="320" cy="360" r="4" fill="#334155"/>
  <circle cx="680" cy="360" r="4" fill="#334155"/>
  <circle cx="500" cy="210" r="4" fill="#334155"/>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M230 450 V535 M770 450 V535"/>
  <path fill="none" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M230 515 H770"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="500" y="545" text-anchor="middle">90 мм</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M651 150 H900 M772 450 H900"/>
  <path fill="none" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M875 150 V450"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="904" y="305" transform="rotate(90 904 305)" text-anchor="middle">50 мм</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M350 150 V105 M650 150 V105"/>
  <path fill="none" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M350 115 H650"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="500" y="98" text-anchor="middle">50 мм</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M230 270 H125 M230 450 H125"/>
  <path fill="none" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M145 270 V450"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="112" y="365" transform="rotate(-90 112 365)" text-anchor="middle">30 мм</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M320 381V412 M680 381V412"/>
  <path fill="none" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M320 405 H680"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="453" y="435" text-anchor="middle">60 мм</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M305 348 L250 309 H213"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="155" y="311">2 × Ø6</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M532 182 L596 128 H622"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="627" y="134">Ø14</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M248 435 L145 485"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="60" y="505">6 × R5</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M340 262 L290 230"/>
  <text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" x="205" y="225">2 × R3</text>
  <path fill="none" stroke="#64748b" stroke-width="1.5" d="M544 210 H748"/>
  <path fill="none" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M730 150 V210"/>
  <text font-family="Arial, sans-serif" font-size="17" fill="#475569" x="741" y="185">10 мм</text>
  <text font-family="Arial, sans-serif" font-size="17" fill="#475569" x="500" y="625" text-anchor="middle">Схема призначена для читання форми й розмірів; остаточний ескіз має бути повністю визначений.</text>
</svg>
