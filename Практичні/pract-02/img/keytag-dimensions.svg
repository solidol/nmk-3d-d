<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">Іменний брелок: розміри та розташування</title><desc id="desc">Приклад 70 на 25 мм; отвір діаметром 5 мм із центром за 6 мм від лівого краю; залишок матеріалу 3,5 мм.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172554}.small{font-size:15px}.head{font-size:22px;font-weight:bold}.shape{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.dim{stroke:#334155;stroke-width:1.3;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#64748b;stroke-width:1;stroke-dasharray:5 4}.logo{fill:#0f766e;stroke:#115e59;stroke-width:1.5}</style>
<rect width="960" height="460" fill="white"/>
<text x="45" y="38" class="head">Вид зверху: приклад компонування</text>
<rect x="100" y="115" width="560" height="200" class="shape"/>
<circle cx="148" cy="215" r="20" fill="white" stroke="#1d4ed8" stroke-width="2"/>
<line x1="118" y1="215" x2="178" y2="215" class="guide"/><line x1="148" y1="185" x2="148" y2="245" class="guide"/>
<path d="M213 255 L213 165 L234 165 L234 234 L275 234 L275 255 Z" class="logo"/>
<text x="318" y="231" font-size="48" style="font-size:48px;font-weight:bold">МРІЯ</text>
<line x1="100" y1="78" x2="660" y2="78" class="dim"/><text x="365" y="67">70 мм</text>
<line x1="702" y1="115" x2="702" y2="315" class="dim"/><text x="717" y="222">25 мм</text>
<line x1="100" y1="351" x2="148" y2="351" class="dim"/><text x="105" y="378">6 мм</text>
<path d="M140 196 L80 160 L30 160" fill="none" stroke="#334155"/><text x="20" y="151">⌀5</text>
<line x1="100" y1="275" x2="128" y2="275" class="dim"/>
<path d="M115 285 L155 404" fill="none" stroke="#334155"/>
<text x="168" y="412" class="small">До фаски: 6 − 2,5 = 3,5 мм</text>
<text x="775" y="145" class="small">Товщина: 4 мм</text>
<text x="775" y="180" class="small">Рельєф: 1 мм</text>
<text x="775" y="215" class="small">Фаска: 0,3 мм</text>
<text x="775" y="250" class="small">Після фаски:</text>
<text x="775" y="278" class="small">3,5 − 0,3 = 3,2 мм</text>
<text x="45" y="447" class="small">Текст і знак умовні; габарити можна змінити, зберігаючи вимоги.</text>
</svg>