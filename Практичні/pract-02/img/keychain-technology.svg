<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Перевірка технологічності брелока</title>
  <desc id="desc">Чотири ознаки надійної моделі: міцна перемичка, читабельний рельєф, оброблені краї та відсутність тонких виступів.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M9 0 0 4.5 9 9" fill="none" stroke="#15803d" stroke-width="1.5"/></marker></defs>
  <rect width="1000" height="420" fill="#f8fafc"/>
  <g transform="translate(40 70)"><rect width="190" height="170" rx="30" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><circle cx="50" cy="55" r="22" fill="#fff" stroke="#15803d" stroke-width="4"/><path d="M28 100h44" stroke="#15803d" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="95" y="215" font-family="Arial" font-size="22" text-anchor="middle">перемичка ≥ 3 мм</text></g>
  <g transform="translate(285 70)"><rect width="190" height="170" rx="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="95" y="100" font-family="Arial" font-size="43" font-weight="700" text-anchor="middle" fill="#1e3a8a">ІМ’Я</text><path d="M45 120h100" stroke="#1d4ed8" stroke-width="7"/><text x="95" y="215" font-family="Arial" font-size="22" text-anchor="middle">читабельний рельєф</text></g>
  <g transform="translate(530 70)"><rect width="190" height="170" rx="38" fill="#fef3c7" stroke="#b45309" stroke-width="4"/><path d="M25 145Q25 25 55 25" fill="none" stroke="#f59e0b" stroke-width="10"/><text x="95" y="215" font-family="Arial" font-size="22" text-anchor="middle">зручні краї</text></g>
  <g transform="translate(775 70)"><path d="M15 160V30h115l45 50-45 20 45 35-55 25Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/><path d="M125 92 175 80" stroke="#b91c1c" stroke-width="10"/><path d="M145 50 180 15M180 50 145 15" stroke="#b91c1c" stroke-width="5"/><text x="95" y="215" font-family="Arial" font-size="22" text-anchor="middle">без крихких виступів</text></g>
</svg>
