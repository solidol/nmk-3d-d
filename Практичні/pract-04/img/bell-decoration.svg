<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Декоративний пояс і напис на поверхні дзвона</title><desc id="desc">На корпус дзвона нанесено повторюваний геометричний орнамент і заглиблений напис.</desc>
  <defs>
    <pattern id="ornament" width="48" height="34" patternUnits="userSpaceOnUse"><path d="M2 17 24 3l22 14-22 14Z" fill="none" stroke="#92400e" stroke-width="3"/><circle cx="24" cy="17" r="5" fill="#f59e0b"/></pattern>
  </defs>
  <rect width="1000" height="520" fill="#f8fafc"/>
  <g transform="translate(70 30)" stroke="#b45309" stroke-width="5">
    <ellipse cx="260" cy="410" rx="210" ry="48" fill="#fcd34d"/>
    <path d="M50 410v-50c0-22 35-45 50-70 50-90 60-175 75-225h170c15 50 25 135 75 225 15 25 50 48 50 70v50" fill="#fef3c7"/>
