  <g font-family="Arial" fill="#0f172a"><text x="620" y="135" font-size="28">Творчий прийом</text><text x="620" y="185" font-size="23">1. Власний елемент орнаменту</text><text x="620" y="225" font-size="23">2. Повторюваний пояс Emboss</text><text x="620" y="265" font-size="23">3. Окремий напис Deboss</text><text x="620" y="305" font-size="23">4. Перевірка уступів і товщини</text><text x="620" y="365" font-size="21">Рельєф: 0,4–0,7 мм</text><text x="620" y="400" font-size="21">Без різьби та копіювання декору</text></g>
