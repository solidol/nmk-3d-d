<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Розмірна схема монтажної панелі</title>
  <desc id="desc">Симетрична панель загальною шириною 90 міліметрів і висотою 50 міліметрів, з верхнім виступом шириною 50 міліметрів, двома отворами діаметром 6 міліметрів та центральним отвором діаметром 14 міліметрів.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .outline { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 4; }
      .hole { fill: #fff; stroke: #c2410c; stroke-width: 4; }
      .axis { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 8; }
      .dim { fill: none; stroke: #334155; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ext { stroke: #64748b; stroke-width: 1.5; }
      .label { font: 20px Arial, sans-serif; fill: #1e293b; }
      .small { font: 17px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1000" height="650" rx="18" fill="#f8fafc"/>
  <text x="500" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#18324d">Монтажна панель</text>
  <path class="outline" d="M260 450 Q230 450 230 420 L230 300 Q230 270 260 270 H332 Q350 270 350 252 V180 Q350 150 380 150 H620 Q650 150 650 180 V252 Q650 270 668 270 H740 Q770 270 770 300 V420 Q770 450 740 450 Z"/>
  <path class="axis" d="M190 360 H810 M500 120 V490"/>
  <circle class="hole" cx="320" cy="360" r="18"/>
  <circle class="hole" cx="680" cy="360" r="18"/>
  <circle class="hole" cx="500" cy="210" r="42"/>
  <circle cx="320" cy="360" r="4" fill="#334155"/>
  <circle cx="680" cy="360" r="4" fill="#334155"/>
  <circle cx="500" cy="210" r="4" fill="#334155"/>
  <path class="ext" d="M230 450 V535 M770 450 V535"/>
  <path class="dim" d="M230 515 H770"/>
  <text class="label" x="500" y="545" text-anchor="middle">90 мм</text>
  <path class="ext" d="M770 150 H900 M770 450 H900"/>
  <path class="dim" d="M875 150 V450"/>
  <text class="label" x="904" y="305" transform="rotate(90 904 305)" text-anchor="middle">50 мм</text>
  <path class="ext" d="M350 150 V105 M650 150 V105"/>
  <path class="dim" d="M350 115 H650"/>
  <text class="label" x="500" y="98" text-anchor="middle">50 мм</text>
  <path class="ext" d="M230 270 H125 M230 450 H125"/>
  <path class="dim" d="M145 270 V450"/>
  <text class="label" x="112" y="365" transform="rotate(-90 112 365)" text-anchor="middle">30 мм</text>
  <path class="dim" d="M320 405 H680"/>
  <text class="label" x="500" y="435" text-anchor="middle">60 мм</text>
  <path class="ext" d="M305 348 L260 315"/>
  <text class="label" x="178" y="310">2 × Ø6</text>
  <path class="ext" d="M532 182 L610 142"/>
  <text class="label" x="620" y="145">Ø14</text>
  <path class="ext" d="M248 435 L145 485"/>
  <text class="label" x="60" y="505">6 × R5</text>
  <path class="ext" d="M340 262 L290 230"/>
  <text class="label" x="205" y="225">2 × R3</text>
  <path class="ext" d="M500 150 H750 M500 210 H750"/>
  <path class="dim" d="M730 150 V210"/>
  <text class="small" x="741" y="185">10 мм</text>
  <text class="small" x="500" y="625" text-anchor="middle">Схема призначена для читання форми й розмірів; остаточний ескіз має бути повністю визначений.</text>
</svg>
