    <text x="36" y="55" font-size="24" font-weight="bold">Людина й телефон за столом · вигляд збоку</text>
    <g fill="#e2e8f0" stroke="#475569" stroke-width="2.5" stroke-linejoin="round">
      <path d="M91 333l8-84q5-37 45-54l11-16 31 8 6 15q38 16 45 47l13 84z"/>
