<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Кут нахилу телефона для перегляду за столом</title>
  <desc id="desc">Людина сидить ліворуч. Лінія погляду йде від ока вниз до центра екрана телефона. Окремо позначено кут погляду до горизонталі та кут екрана до стільниці.</desc>
  <rect width="900" height="420" rx="16" fill="#f1f5f9"/>
