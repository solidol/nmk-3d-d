    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="1080" height="535" fill="#f1f5f9"/>
  <g fill="#fff" stroke="#cbd5e1">
    <rect x="16" y="16" width="316" height="503" rx="14"/>
    <rect x="344" y="16" width="352" height="503" rx="14"/>
    <rect x="708" y="16" width="356" height="503" rx="14"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#0f172a" font-size="22" font-weight="bold">
    <text x="36" y="56">Виміри телефона</text>
    <text x="364" y="56">Вигляд збоку</text>
    <text x="728" y="56">Вигляд згори</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="#e2e8f0">
    <rect x="65" y="125" width="128" height="246" rx="16"/>
    <rect x="241" y="125" width="22" height="246" rx="8"/>
    <rect x="128" y="364" width="20" height="7" rx="3" fill="#475569"/>
    <path d="M519 377 L543 368 L456 129 Q454 123 448 125 L436 129 Q430 131 432 137 Z"/>
  </g>
  <g fill="#a5d8ff" stroke="#174a7e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M375 378 H503 L420 150 L433 145 L518 378 H544 V347 H556 V378 H665 V393 H375 Z"/>
    <path d="M751 140 H1021 V414 H905 V306 H869 V414 H751 Z"/>
    <path d="M776 230 H996 V247 H776 Z" fill="#6babda"/>
    <path d="M776 303 H869 V321 H776 Z M905 303 H996 V321 H905 Z" fill="#6babda"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5">
    <path d="M787 252 H985 V302 H787 Z"/>
    <path d="M138 353 V445 M888 262 V431"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="1">
