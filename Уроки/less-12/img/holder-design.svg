<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="535" viewBox="0 0 1080 535" role="img" aria-labelledby="title desc">
  <title id="title">Виміри телефона та два види нерухомого тримача</title>
  <desc id="desc">Ширина, товщина і зміщення роз’єму телефона, бічний профіль тримача та відкритий кабельний канал на вигляді згори.</desc>
