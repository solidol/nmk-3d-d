    <path d="M67 399 H191"/><path d="M242 399 H262"/><path d="M67 439 H136"/>
    <path d="M377 432 H663"/><path d="M753 454 H1019"/>
    <path d="M872 383 H902"/>
  </g>
  <g fill="none" stroke="#1d4ed8" stroke-width="1.5">
    <path d="M476 378 A27 27 0 0 1 494 353"/>
    <path d="M521 301 L509 311 M600 318 L551 347 M862 350 L869 364"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#0f172a">
    <text x="129" y="390" text-anchor="middle" fill="#1d4ed8">W</text>
    <text x="252" y="390" text-anchor="middle" fill="#1d4ed8">T</text>
    <text x="101" y="431" text-anchor="middle" fill="#1d4ed8">C</text>
    <text x="64" y="490">C — до центра роз’єму</text>
    <text x="392" y="351" fill="#1d4ed8">65–75°</text>
    <text x="524" y="292">Телефон</text>
    <text x="573" y="311">Бортик</text>
    <text x="520" y="423" text-anchor="middle" fill="#1d4ed8">глибина ≥ 75 мм</text>
    <text x="886" y="213" text-anchor="middle">Задня опора</text>
    <text x="886" y="281" text-anchor="middle">Посадочне місце</text>
    <text x="855" y="346" text-anchor="end">Канал</text>
    <text x="912" y="389" fill="#1d4ed8">≥ 12 мм</text>
    <text x="886" y="445" text-anchor="middle" fill="#1d4ed8">ширина ≥ 80 мм</text>
    <text x="886" y="490" text-anchor="middle">Передній край</text>
