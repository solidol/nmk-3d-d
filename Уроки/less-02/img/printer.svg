<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Основні вузли принтера з полімерною ниткою</title>
  <desc id="desc">Котушка подає нитку через механізм подавання до нагрівального вузла та сопла; деталь утворюється на платформі.</desc>
  <rect width="900" height="460" rx="18" fill="#f5f8fc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#18324d">Шлях матеріалу в 3D-принтері</text>
  <rect x="190" y="85" width="500" height="325" rx="8" fill="none" stroke="#64748b" stroke-width="13"/>
  <circle cx="270" cy="122" r="48" fill="#2563eb"/>
  <circle cx="270" cy="122" r="20" fill="#f5f8fc"/>
  <path d="M317 122H445v60" fill="none" stroke="#f59e0b" stroke-width="7"/>
  <rect x="421" y="173" width="48" height="55" rx="5" fill="#0f766e"/>
  <path d="M445 228v48" stroke="#f59e0b" stroke-width="7"/>
  <rect x="407" y="277" width="76" height="46" rx="6" fill="#475569"/>
  <path d="M433 323h24l-12 24z" fill="#ea580c"/>
  <rect x="315" y="367" width="270" height="19" rx="4" fill="#64748b"/>
  <path d="M389 366v-25h112v25" fill="#3b82f6"/>
  <text x="54" y="113" font-family="Arial, sans-serif" font-size="19" fill="#18324d">Котушка</text>
  <path d="M141 109h75" stroke="#18324d" stroke-width="2"/>
  <text x="530" y="151" font-family="Arial, sans-serif" font-size="19" fill="#18324d">Механізм подавання</text>
  <path d="M520 156l-54 39" stroke="#18324d" stroke-width="2"/>
  <text x="535" y="273" font-family="Arial, sans-serif" font-size="19" fill="#18324d">Нагрівальний вузол</text>
  <path d="M526 278l-42 20" stroke="#18324d" stroke-width="2"/>
  <text x="535" y="336" font-family="Arial, sans-serif" font-size="19" fill="#18324d">Сопло</text>
  <path d="M525 333l-70 5" stroke="#18324d" stroke-width="2"/>
  <text x="40" y="385" font-family="Arial, sans-serif" font-size="19" fill="#18324d">Платформа</text>
  <path d="M140 380h172" stroke="#18324d" stroke-width="2"/>
  <text x="450" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Схема спрощена; розміщення вузлів залежить від моделі принтера.</text>
</svg>
