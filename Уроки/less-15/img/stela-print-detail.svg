  <title id="title">П’ять прикладів спрощення стели</title>
  <desc id="desc">У кожному рядку ліворуч початкова форма, праворуч спрощена. Штрих літери потовщено, тонку хвилю пропущено, три сходинки зведено до однієї, фігурний кут замінено одним скосом, дрібні прорізи замінено одним більшим.</desc>
