<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Основні ділянки інтерфейсу CAD-системи</title>
  <desc id="desc">Умовна схема: угорі панель інструментів, ліворуч браузер моделі, у центрі робоча область, праворуч куб огляду, унизу шкала історії.</desc>
  <rect width="900" height="470" rx="18" fill="#f5f8fc"/>
  <text x="450" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#18324d">Орієнтир в інтерфейсі Fusion</text>
  <rect x="52" y="66" width="796" height="359" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <rect x="52" y="66" width="796" height="58" rx="8" fill="#dbeafe"/>
  <text x="450" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#18324d">Панель інструментів</text>
  <rect x="52" y="124" width="190" height="266" fill="#e2e8f0"/>
  <text x="147" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#18324d">Браузер моделі</text>
  <path d="M78 188h138m-138 31h114m-114 31h122m-122 31h100" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <text x="510" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#18324d">Робоча область</text>
  <path d="M390 300l110-62 112 62-111 63z" fill="#93c5fd" stroke="#2563eb" stroke-width="3"/>
  <path d="M390 300v-70l110-63v71m112 62v-70l-112-63" fill="none" stroke="#2563eb" stroke-width="3"/>
  <rect x="739" y="143" width="82" height="72" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="780" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#18324d">Куб</text>
  <text x="780" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#18324d">огляду</text>
  <rect x="52" y="390" width="796" height="35" fill="#cbd5e1"/>
  <text x="450" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#18324d">Шкала історії</text>
  <text x="450" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Умовна схема: вигляд програми може відрізнятися.</text>
</svg>
