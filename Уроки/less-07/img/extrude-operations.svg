<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Операції витягування у Fusion</title>
  <desc id="desc">Показано перехід від плоского профілю до нового тіла, приєднання об’єму та вирізання матеріалу.</desc>
  <rect width="1100" height="390" rx="18" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18324d">Операція Extrude</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(45 78)"><rect width="220" height="250" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/><path d="M55 150l55-32 55 32-55 32z" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><path d="M110 118V65" stroke="#ef4444" stroke-width="5"/><path d="M98 80l12-18 12 18" fill="none" stroke="#ef4444" stroke-width="5"/><text x="110" y="220" font-size="20" fill="#18324d">Профіль</text></g>
    <g transform="translate(315 78)"><rect width="220" height="250" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><path d="M48 145l62-36 62 36-62 36z" fill="#86efac" stroke="#15803d" stroke-width="3"/><path d="M48 145v-65l62-36 62 36v65M110 44v65" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><text x="110" y="220" font-size="20" fill="#18324d">New Body</text></g>
    <g transform="translate(585 78)"><rect width="220" height="250" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><path d="M35 165l75-43 75 43-75 43z" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/><path d="M70 142v-55l40-23 40 23v55M110 64v58" fill="#fdba74" stroke="#c2410c" stroke-width="3"/><text x="110" y="220" font-size="20" fill="#18324d">Join</text></g>
    <g transform="translate(855 78)"><rect width="200" height="250" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/><path d="M28 165l72-42 72 42-72 42z" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><path d="M28 165v-82l72-42 72 42v82M100 41v82" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><ellipse cx="100" cy="98" rx="25" ry="14" fill="#fff" stroke="#b91c1c" stroke-width="3"/><path d="M75 98v58M125 98v58" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 5"/><text x="100" y="220" font-size="20" fill="#18324d">Cut</text></g>
  </g>
  <text x="550" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Перед підтвердженням перевірте профіль, напрямок, відстань і тип операції.</text>
</svg>
