<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Послідовність створення векторного логотипа</title>
  <desc id="desc">Прості фігури компонуються, перетворюються на чистий контур і зберігаються у форматі SVG.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker></defs>
  <rect width="1000" height="390" fill="#f8fafc"/>
  <g transform="translate(45 70)"><rect x="20" y="55" width="110" height="110" rx="16" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/><circle cx="145" cy="90" r="55" fill="#fef3c7" stroke="#b45309" stroke-width="4"/><path d="M80 190 145 85 210 190Z" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="115" y="255" font-family="Arial" font-size="24" text-anchor="middle">1. Фігури</text></g>
  <path d="M285 175h75" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(390 70)"><path d="M35 180 105 55l35 60 35-60 70 125-70-25-70 25Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="5"/><circle cx="140" cy="125" r="24" fill="#fff" stroke="#1d4ed8" stroke-width="4"/><g fill="#dc2626"><circle cx="35" cy="180" r="6"/><circle cx="105" cy="55" r="6"/><circle cx="140" cy="115" r="6"/><circle cx="175" cy="55" r="6"/><circle cx="245" cy="180" r="6"/></g><text x="140" y="255" font-family="Arial" font-size="24" text-anchor="middle">2. Контури й вузли</text></g>
  <path d="M660 175h75" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(765 55)"><rect width="180" height="210" rx="12" fill="#fff" stroke="#64748b" stroke-width="3"/><path d="M25 165 75 55l25 55 25-55 35 110-60-22Z" fill="#1d4ed8"/><circle cx="100" cy="125" r="17" fill="#fff"/><text x="90" y="245" font-family="Arial" font-size="24" text-anchor="middle">3. Чистий SVG</text></g>
</svg>
