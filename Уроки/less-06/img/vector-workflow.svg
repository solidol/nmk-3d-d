<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Підготовка SVG для Fusion</title>
  <desc id="desc">Чотири етапи: створення простих фігур, очищення контурів, збереження SVG та вставлення в ескіз Fusion.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker></defs>
  <rect width="1100" height="360" rx="18" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18324d">Від фігур до ескізу Fusion</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="82" width="220" height="220" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <circle cx="105" cy="165" r="32" fill="#38bdf8"/><rect x="140" y="130" width="70" height="70" rx="8" fill="#f59e0b"/><path d="M75 235l45-55 45 55z" fill="#22c55e"/>
    <text x="150" y="280" font-size="20" fill="#18324d">1. Прості фігури</text>
    <rect x="315" y="82" width="220" height="220" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <path d="M370 228V142h110v86zM400 198v-28h50v28z" fill="#86efac" fill-rule="evenodd" stroke="#15803d" stroke-width="4"/>
    <text x="425" y="280" font-size="20" fill="#18324d">2. Чисті контури</text>
    <rect x="590" y="82" width="220" height="220" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <path d="M650 120h85l35 35v105H650z" fill="#fed7aa" stroke="#c2410c" stroke-width="4"/><path d="M735 120v35h35" fill="none" stroke="#c2410c" stroke-width="4"/>
    <text x="700" y="205" font-size="29" font-weight="700" fill="#9a3412">SVG</text><text x="700" y="280" font-size="20" fill="#18324d">3. Збереження</text>
    <rect x="865" y="82" width="195" height="220" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <path d="M915 230l48-85 48 85z" fill="#a5b4fc" stroke="#4338ca" stroke-width="4"/><ellipse cx="963" cy="230" rx="48" ry="18" fill="#818cf8" opacity=".65"/>
    <text x="963" y="280" font-size="20" fill="#18324d">4. Ескіз Fusion</text>
  </g>
  <path d="M270 192h32M545 192h32M820 192h32" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <text x="550" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Для витягування потрібні замкнуті профілі без дублікатів і розривів.</text>
</svg>
