<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Навчальний ескіз панелі із сімома замкнутими контурами</title>
  <desc id="desc">У зовнішньому прямокутнику чотири кола біля кутів, прямокутне вікно ліворуч і трикутник праворуч. Усі контури відокремлені. Розміри не задано.</desc>
  <rect width="900" height="480" rx="18" fill="#f5f8fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#18324d">
    <text x="450" y="42" font-size="25" font-weight="bold">Панель: сім замкнутих контурів</text>
    <text x="450" y="76" font-size="17">Один зовнішній контур і шість внутрішніх</text>
  </g>
  <rect x="130" y="110" width="640" height="280" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <g fill="#f5f8fc" stroke="#ea580c" stroke-width="4">
    <circle cx="178" cy="158" r="19"/>
    <circle cx="722" cy="158" r="19"/>
    <circle cx="178" cy="342" r="19"/>
    <circle cx="722" cy="342" r="19"/>
    <rect x="270" y="205" width="180" height="90"/>
    <path d="M535 295 L655 295 L595 195 Z"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#18324d" font-size="17">
    <text x="360" y="255">Вікно</text>
    <text x="595" y="327">Три відрізки</text>
    <text x="450" y="431">Кола та внутрішні фігури не торкаються інших контурів.</text>
    <text x="450" y="458" fill="#475569">Схема без точних розмірів; кольори умовні.</text>
  </g>
</svg>
